

trigger:
  branches:
    include:
      - main

pr: none


pool:
  name: Default

variables:
  buildConfiguration: 'Release'
  apiProject: 'src/Valky.Api/Valky.Api.csproj'
  testProject: 'tests/Valky.Tests/Valky.Tests.csproj'

stages:
  - stage: Build
    displayName: 'Build, Testes e Artefato'
    jobs:
      - job: BuildJob
        displayName: 'Build da Valky API'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK (versão fixada no global.json)'
            inputs:
              packageType: 'sdk'
              useGlobalJson: true

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: |
                $(apiProject)
                $(testProject)

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: |
                $(apiProject)
                $(testProject)
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Testes automatizados (xUnit)'
            inputs:
              command: 'test'
              projects: '$(testProject)'
              arguments: '--configuration $(buildConfiguration) --no-build --collect "XPlat Code Coverage"'
              publishTestResults: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura de testes'
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

          - task: DotNetCoreCLI@2
            displayName: 'Publish da API (pacote .zip)'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(apiProject)'
              arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/app'
              zipAfterPublish: true

          - task: CopyFiles@2
            displayName: 'Copiar script-bd.sql para o artefato'
            inputs:
              SourceFolder: 'scripts'
              Contents: '*.sql'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/scripts'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefato (drop)'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'